<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lisettamare Voucher</title>

    <!-- Optional: prevent caching (helps if you ever update the target) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f6f7f9;
        color: #111;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 18px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #444;
        line-height: 1.35;
      }
      .small {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        word-break: break-all;
      }
      a { color: #1a73e8; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <h1>Reindirizzamento in corso…</h1>
        <p>Stiamo aprendo il voucher Lisettamare.</p>
        <p class="small" id="debug"></p>

        <noscript>
          <p style="margin-top:12px;">
            JavaScript è disattivato. Apri il voucher qui:
            <a id="fallback" href="#">Apri voucher</a>
          </p>
        </noscript>
      </div>
    </div>

    <script>
      // ✅ Put your Apps Script Web App base URL here (must end with /exec)
      const WEBAPP_BASE =
        "https://script.google.com/macros/s/AKfycbwE5yRLevNHGb8UZXbhp0-QZOTh5StD7CZnoTNa5f_QqA8dg-VmtRerjzDDhPnGH1Em/exec";

      const params = new URLSearchParams(location.search);
      const v = params.get("v"); // e.g. VCH-8F9DA551

      const debugEl = document.getElementById("debug");

      if (!v) {
        // No voucher id
        document.querySelector("h1").textContent = "Voucher mancante";
        document.querySelector("p").textContent =
          "Questo link non contiene un ID voucher. Controlla che il QR sia corretto.";
        if (debugEl) debugEl.textContent = "Esempio: /voucher.html?v=VCH-ABCDEFGH";
      } else {
        const target =
          WEBAPP_BASE + "?action=redeem&voucher_id=" + encodeURIComponent(v);

        // Fallback link for noscript or rare edge cases
        const a = document.getElementById("fallback");
        if (a) a.href = target;

        // Optional debug text
        if (debugEl) debugEl.textContent = target;

        // ✅ Redirect
        location.replace(target);
      }
    </script>
  </body>
</html>
